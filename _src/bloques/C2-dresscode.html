<!-- INSERTAR: reemplaza #dresscode -->
<section id="dresscode" aria-label="Código de vestimenta">
  <div class="c2-dc-wrap">
    <div class="c2-dc-eyebrow">Etiqueta</div>
    <h2 class="c2-dc-title">Dress Code</h2>
    <div class="c2-dc-formal">Formal</div>
    <div class="c2-dc-strip" aria-hidden="true"></div>

    <p class="c2-dc-sub">Colores a evitar</p>
    <div class="c2-dc-palette" id="c2-dc-swatches">
      <div class="c2-dc-sw" style="--d:0s">
        <div class="c2-dc-ball c2-dc-ball--light" style="background:#FFFFFF"></div>
        <div class="c2-dc-name">Blanco</div>
      </div>
      <div class="c2-dc-sw" style="--d:-1.1s">
        <div class="c2-dc-ball" style="background:#B51A00"></div>
        <div class="c2-dc-name">Rojo</div>
      </div>
      <div class="c2-dc-sw" style="--d:-2.2s">
        <div class="c2-dc-ball" style="background:#0042A9"></div>
        <div class="c2-dc-name">Azul rey</div>
      </div>
    </div>

    <p class="c2-dc-note">Para seguir la dinámica de color les sugerimos un detalle pequeño en color azul o plata.</p>

    <div class="c2-dc-avoid">
      <p>El blanco es únicamente para la novia.</p>
    </div>
  </div>
</section>
