<section id="itinerary" aria-labelledby="g73-it-title">
  <div class="g73-it-inner">
    <p class="g73-it-kicker">Nuestro gran día</p>
    <h2 class="g73-it-title g73-foil" id="g73-it-title">Itinerario</h2>
    <div class="g73-it-timeline">

      <!-- Ceremonia religiosa -->
      <div class="g73-it-step">
        <div class="g73-it-ico" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <line x1="32" y1="3" x2="32" y2="16"/>

        </div>
        <div class="g73-it-dot"></div>
        <div class="g73-it-text">
          <span class="g73-it-label">Ceremonia religiosa</span>
          <span class="g73-it-time g73-it-tbc">Por confirmar</span>
        </div>
      </div>

      <!-- Recepción -->
      <div class="g73-it-step">
        <div class="g73-it-ico" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <rect x="10" y="10" width="44" height="50" rx="2"/>

          <span class="g73-it-label">Recepción</span>
          <span class="g73-it-time">8:00 PM</span>
        </div>
      </div>

      <!-- Cena -->
      <div class="g73-it-step">
        <div class="g73-it-ico" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <line x1="16" y1="6" x2="16" y2="58"/>
            <line x1="12" y1="6" x2="12" y2="20"/>

        </div>
        <div class="g73-it-dot"></div>
        <div class="g73-it-text">
          <span class="g73-it-label">Cena</span>
          <span class="g73-it-time g73-it-tbc">Por confirmar</span>
        </div>
      </div>

      <!-- Primer baile -->
      <div class="g73-it-step">
        <div class="g73-it-ico" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <path d="M32 52 C13 39 9 26 15 18 C20 12 29 14 32 22 C35 14 44 12 49 18 C55 26 51 39 32 52 Z"/>

          </svg>
        </div>
        <div class="g73-it-dot"></div>
        <div class="g73-it-text">
          <span class="g73-it-label">Primer baile</span>
          <span class="g73-it-time g73-it-tbc">Por confirmar</span>
        </div>
      </div>

      <!-- Fiesta -->
      <div class="g73-it-step">
        <div class="g73-it-ico" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <line x1="32" y1="2" x2="32" y2="10"/>
            <circle cx="32" cy="26" r="16"/>

            <line x1="42" y1="46" x2="42" y2="54"/>
            <line x1="12" y1="50" x2="52" y2="50"/>

        <div class="g73-it-text">
          <span class="g73-it-label">Fiesta</span>
          <span class="g73-it-time g73-it-tbc">Por confirmar</span>
